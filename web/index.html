<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>聊天室 · ldsjypl.online</title>
<link rel="stylesheet" href="/style.css?v=3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <!-- ---------------------------------------------------------- 大厅 -->
  <section id="lobby" class="screen">
    <header class="brand">
      <h1>聊天室</h1>
      <p class="tag">开一间房，把房号发给朋友就能聊</p>
    </header>

    <div class="card">
      <label class="field">昵称
        <input id="nick" maxlength="24" placeholder="例如：小林" autocomplete="nickname">
      </label>

      <button id="createBtn" class="primary big" type="button">＋ 新建房间</button>

      <div class="join-row">
        <input id="roomInput" inputmode="numeric" maxlength="6" placeholder="输入 6 位房号">
        <button id="joinBtn" type="button">加入</button>
      </div>

      <p class="err" id="lobbyErr"></p>
      <p class="conn" id="lobbyStatus"></p>
    </div>

    <div class="howto">
      <h2>怎么用</h2>
      <ol>
        <li>填昵称，点「新建房间」，系统会分一个 6 位房号给你</li>
        <li>房号不公开，只有拿到房号的人才能进来 —— 私下发给朋友</li>
        <li>房间里最后一个人离开 2 分钟后，房间和记录自动清空</li>
      </ol>
      <p class="limits">当前上限：50 个房间 · 每间 30 人</p>
    </div>
  </section>

  <!-- ---------------------------------------------------------- 聊天 -->
  <section id="chat" class="screen" hidden>
    <header id="bar">
      <div class="room">
        <span class="dot" id="status"></span>
        <span class="title" id="roomTitle">聊天室</span>
      </div>
      <div class="meta">
        <button id="usersBtn" type="button">在线 <b id="online">0</b></button>
        <button id="leaveBtn" type="button">离开</button>
      </div>
    </header>

    <div id="usersPanel" class="users-panel" hidden></div>
    <main id="messages" aria-live="polite"></main>
    <div id="hint" class="hint"></div>

    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="说点什么…" maxlength="2000" enterkeyhint="send" disabled>
      <button id="send" type="submit" disabled>发送</button>
    </form>
  </section>

</div>
<div id="toast" class="toast"></div>
<script src="/app.js?v=3"></script>
</body>
</html>
